[project]
name = "acl-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "padrisimo", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.23",
    "dotenv>=0.9.9",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langchain[openai]>=1.4.4",
    "numpy>=2.5.3",
    "pypdf>=6.20.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
acl-rag = "acl_rag:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
